[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "sutraopt"
version = "1.0.0"
description = "SutraOpt (BharatOpt) — Indigenous GPU-Accelerated Mathematical Optimization Solver"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "SutraOpt Team", email = "sutraopt@bharatoptimization.in"}
]
keywords = [
    "optimization", "linear-programming", "milp", "gpu", "solver",
    "operations-research", "interior-point", "branch-and-cut"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=12.0"]
benchmark = ["highspy>=1.5"]
dev = ["pytest>=7.0", "pytest-cov", "black", "ruff"]

[project.scripts]
sutraopt = "sutra_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sutraopt*"]

[tool.pytest.ini_options]
testpaths = ["test_suite.py", "tests/"]
