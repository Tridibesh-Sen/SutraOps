version: '3.8'

services:
  sutraopt-api:
    build: .
    image: sutraopt:latest
    container_name: sutraopt_service
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - WORKERS=4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
